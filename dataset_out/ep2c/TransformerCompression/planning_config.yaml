training:
  learning_rate: 1e-4
  batch_size: 128
  epochs: 3
  optimizer: AdamW
  weight_decay: 0.01
  warmup_steps: 500
  total_steps: 10000
model:
  model_name: "llama2"
  model_checkpoint_path: "/path/to/llama2/checkpoints"
  use_rmsnorm: true
data:
  calibration_dataset:
    name: "WikiText-2"
    sample_size: 1024
    sequence_length: 2048
  fine_tuning_dataset:
    name: "Alpaca"
    sample_size: 5000
    sequence_length: 1024
slicing:
  ratio: 0.25  # 25% weight parameters removal
  spectrum_threshold: "auto"  # based on eigen-spectrum decay
evaluation:
  tasks:
    - perplexity
    - zero_shot_accuracy
  hardware:
    device: "cuda"  # or "cpu" for testing
    gpus: 1
    use_speed_measure: true