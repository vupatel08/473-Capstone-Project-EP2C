dataset:
  name: CIFAR10
  input_size: [32, 32]
  train_split: 50000
  test_split: 10000
  batch_size: 128

model:
  name: ResNet50
  pretrained: true

mask_generator:
  architecture_depth: 5
  kernel_size: 3
  filters: 64
  pooling_layers: 2
  output_ratio: 1/8

training:
  optimizer: Adam
  learning_rate: 0.01
  lr_decay_epochs: [100]
  lr_decay_factor: 0.1
  epochs: 200
  pattern_lr: 0.001
  pattern_lr_decay_epochs: [100]
  pattern_lr_decay_factor: 0.1
  weight_decay: 1e-4
  pattern_init: zeros

sampling:
  image_resize: [32, 32]
  patch_size: 8

evaluation:
  metrics: accuracy
  visualize: true

reproducibility:
  seed: 42