# Model configuration
model:
  pretrained_model_name_or_path: "gpt2-medium"  # Replace with your base model for fine-tuning

# Dataset parameters
dataset:
  dataset_path: "path/to/your/dataset"     # Path to initial dataset for sampling prompts and responses
  sample_size: 50000                        # Number of prompts sampled for response generation in each iteration

# Response generation parameters
generation:
  max_length: 100                          # Max response tokens
  temperature: 0.7                         # Sampling temperature

# Training hyperparameters
training:
  epochs: 2                                # Number of epochs per iteration
  learning_rate: 3e-5                      # Model training learning rate
  batch_size: 8                            # Batch size for model fine-tuning
  discriminator_epochs: 3                  # Discriminator training epochs
  discriminator_batch_size: 32             # Batch size for discriminator training

# Self-play iterations
iterations: 4                            # Total number of self-play iterations

# Reweighting
lambda_value: 0.2                        # Regularization coefficient as per paper (approximate, adjustable)

# Logging and saving
save_dir: "outputs/spin"                   # Directory to save model checkpoints and logs
log_interval: 100                        # Logging interval (steps)
evaluation_interval: 1000                # Evaluation interval (steps)

# Hardware configuration
use_gpu: true                            # Whether to utilize GPU for training

# Miscellaneous
seed: 42                                # Random seed for reproducibility