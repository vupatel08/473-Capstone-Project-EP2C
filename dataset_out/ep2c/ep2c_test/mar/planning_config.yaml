training:
  learning_rate: 8e-4
  batch_size: 2048
  epochs: 400
  warmup_epochs: 10
  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.02
    betas: [0.9, 0.999]
  gradient_clip_norm: 1.0

model:
  transformer:
    num_layers: 32
    hidden_dim: 1024
    num_heads: 16
    dropout_rate: 0.1
    max_sequence_length: 1024
  diffusion_denoiser:
    residual_blocks: 3
    residual_width: 1024

diffusion:
  schedule_type: cosine
  total_steps: 1000
  inference_steps: 100
  noise_schedule_params:
    s: 0.008
  temperature: 1.0
  temperature_scale_method: scale_noise

dataset:
  name: ImageNet256
  path: /path/to/imagenet256/encoded_tokens
  tokenizer_type: vq-gan
  tokenizer_name: vq-16
  sequence_length: 1024
  shuffle_buffer_size: 65536
  normalization: true

training_schedule:
  warmup_epochs: 10
  total_epochs: 400
  steps_per_epoch: 2500  # approximate, depends on dataset size
  total_training_steps: 1,000,000

evaluation:
  fid_scoring_lib: "torch-fid"
  fid_real_dataset_path: /path/to/imagenet/validation_tokens
  eval_batch_size: 512
  eval_steps: 10000
  metrics:
    - FID
    - InceptionScore
    - Precision
    - Recall

output_paths:
  checkpoints_dir: "./checkpoints/"
  sample_results_dir: "./samples/"
  evaluation_results_dir: "./eval/"

# Additional parameters related to reproducibility
seed: 42