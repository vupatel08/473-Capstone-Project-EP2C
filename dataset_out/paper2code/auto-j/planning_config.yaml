training:
  learning_rate: 0.00001          # Based on typical large-model fine-tuning (adjust as needed)
  batch_size: 64                  # Suggested batch size for large-scale training
  epochs: 5                       # Number of epochs (paper mentions training on ~6750 steps; set accordingly)
  warmup_steps: 6750             # 6.75k steps warm-up as per paper's decay schedule
  decay_rate: 0.95                # Exponential decay of learning rate per epoch
  max_seq_length: 2048            # Maximum token length
  gradient_checkpointing: true    # Use for memory efficiency
  optimizer: AdamW                # Optimizer as generally recommended
  weight_decay: 0.1               # Typical weight decay for large models
  num_checkpoints: 50             # Save model every 50 steps
  
dataset:
  train_samples: 999000          # Approximate based on 58 scenarios and sample counts
  val_samples: 10,000             # Validation set size
  test_samples: 10,000            # Test set size
  scenario_list: [summarization, exam_questions, code, rewriting, creative_writing, ...] # Full list of 58 scenarios
  
annotation:
  gpt_api_url: "https://api.openai.com/v1/chat/completions"  # GPT-4 API endpoint
  api_key_env: "OPENAI_API_KEY"    # Environment variable placeholder for API key
  prompt_template: |              # Prompt for response annotation (see Tab. 19, 20)
    {scenario_criteria}
    {query}
    Response:
    {response}
    Critique:
    {critique}
  
  response_format: |                # Structured output format (e.g., markdown or JSON)
    {
      "rating": number (1-10),
      "critique": string
    }
  
model:
  base_model: "decapoda-research/llama-2-13b-hf"  # Initial pre-trained weights
  fine_tune_epochs: 5                             # From training setting
  learning_rate: 1e-5                            # Typical for fine-tuning
  weight_decay: 0.1
  max_seq_length: 2048
  checkpoint_path: "checkpoints/auto_j_checkpoint"
  save_every_steps: 50
  optimizer: AdamW
  use_deepspeed: true                            # For large-scale memory-efficient training
  
evaluation:
  metrics:
    pairwise_accuracy: "Compare model predictions with GPT-4 preferences"
    correlation: "Calculate Pearson and Spearman correlation between AUTO-J scores and human labels"
    consistency: "Check response order robustness as in Sec 6.1"
  batch_size: 64
  evaluation_protocols:
    pairwise_comparison: true
    single_response_rating: true
  evaluation_scenarios: [listed scenarios as in dataset.scenario_list]