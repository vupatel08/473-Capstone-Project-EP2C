training:
  learning_rate: 0.0001
  batch_size: 16
  total_iterations: 1000000
  iterations_per_epoch: 5000
  image_crop_size: 64
  augmentation:
    flip: true
    rotations: [90, 180, 270]
  optimizer:
    type: Adam
    betas: [0.9, 0.99]
evaluation:
  scale: 2  # upscaling factor
  datasets:
    train:
      - DIV2K
      - Flickr2K
    test:
      - Set5
      - B100
      - Urban100
      - Manga109
  metrics:
    - PSNR
    - SSIM
    - LPIPS
diffusion:
  total_timesteps: 2000
  sampler_type: DDIM
  inference_timesteps: 50
model:
  channels: 64
  encoder_levels: 4
  res_blocks_per_level: 2
  decoder_res_blocks: 3
  timestep_encoding_K: 5
  binarization:
    scale_weights: true
    bias_pairs: 5
optimizer:
  type: Adam
  lr: 0.0001
  betas: [0.9, 0.99]