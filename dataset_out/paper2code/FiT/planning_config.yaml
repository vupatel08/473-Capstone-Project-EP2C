training:
  total_steps: 400000
  batch_size: 256
  learning_rate: 1e-4
  guidance_scale: 4.0
  ema_decay: 0.9999

dataset:
  name: ImageNet
  resolution: 256
  subset_size: full

model:
  architecture: FiT
  patch_size: 2
  hidden_dims: 768  # for FiT-B; for FiT-XL, set accordingly
  layers: 12
  attention_heads: 12
  ffn_type: SwiGLU
  pretrained_vae_path: "path/to/pretrained/vae"
  pretrained_diffusion_path: "path/to/pretrained/diffusion"

optimization:
  optimizer: AdamW
  weight_decay: 0.01
  scheduler: linear_warmup_and_decay
  warmup_steps: 10000
  learning_rate: 1e-4

extrapolation:
  method: NTK  # or 'YaRN'
  max_resolution: [1024, 1024]
  resolution_inference: [512, 512]
  aspect_ratio_test: [1:2, 1:3]

generation:
  inference_steps: 250
  guidance_scale: 4.0

evaluation:
  fid_samples: 10,000
  is_samples: 2,000
  reference_dataset: ImageNet validation split

logging:
  output_dir: "./outputs"
  save_checkpoints: true
  save_interval: 10000
  log_interval: 500