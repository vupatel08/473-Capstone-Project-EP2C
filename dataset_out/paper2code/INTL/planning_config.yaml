training:
  learning_rate: 0.3
  batch_size: 256
  epochs: 1000
  warmup_epochs: 2
  schedule: cosine_decay
  weight_decay: 1e-4
  momentum: 0.9
  spe_iteration_T: 4
  spe_method: Newton
  spe_p: 0.5
  trace_loss_weight: 0.01
  spe_epsilon: 1e-5
model:
  backbone: ResNet50
  projection_dim: 8192
  projection_layers: 2
  hidden_dim: 4096
data:
  dataset: ImageNet-100
  dataset_type: image_classification
  dataset_params:
    crop_size: 224
    total_crops: 2
    local_crops: 2
    global_crops: 2
    crop_scale_max: 1.0
    crop_scale_min: 0.08
    augmentation_params:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
      color_jitter_prob: 0.8
      horizontal_flip_prob: 0.5
      gaussian_prob: 0.0
      solarization_prob: 0.1
training_strategy:
  use_Ema: true
  use_MultiCrop: true
  spectr_enable: true
  spectr_type: Newton
  T_iter: 4
  p_modulation: 0.5
  trace_loss_weight: 0.01
evaluation:
  dataset: ImageNet-100
  eval_type: linear_classification
  metric: accuracy