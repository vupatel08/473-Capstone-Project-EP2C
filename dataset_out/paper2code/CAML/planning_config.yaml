training:
  learning_rate: 1e-5
  warmup_steps: 9600
  total_steps: 400000
  cosine_decay: true
  batch_size: 525
  support_shot: 5
  way: 5
  evaluation_episodes: 1000
  eval_support_shot: 5
  eval_way: 5
model:
  image_encoder: "openai/clip-vit-base-patch32"
  image_encoder_trainable: false
  label_embedding_dim: 256
  transformer_model_name: "facebook/vit-large-patch16-224"
  transformer_params:
    num_layers: 24
    num_heads: 16
    hidden_dim: 1024
    dropout: 0.0
dataset:
  datasets:
    - name: "mini-ImageNet"
      split: "train"
    - name: "CIFAR-fs"
      split: "train"
    - name: "tiered-ImageNet"
      split: "train"
    - name: "Pascal VOC"
      split: "train"
    - name: "Paintings"
      split: "train"
evaluation:
  episodes: 1000
  support_shot: 5
  way: 5
  permutation_test_episodes: 1000
  datasets:
    - name: "mini-ImageNet"
    - name: "CIFAR-fs"
    - name: "tiered-ImageNet"
    - name: "Pascal VOC"
    - name: "Paintings"